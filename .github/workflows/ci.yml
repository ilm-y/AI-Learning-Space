name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (unit + real RabbitMQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -Pmq-integration 把 ails.it.require-docker 设为 true：
      # 集成测试必须真的连上 RabbitMQ，Docker 不可用会让构建失败，
      # 而不是把「跳过」伪装成「通过」。
      - name: Tests (unit + Testcontainers RabbitMQ)
        working-directory: backend/backend
        run: ./mvnw -B clean test -Pmq-integration

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/backend/target/surefire-reports/
          if-no-files-found: ignore

  agent:
    name: Agent (unit + real RabbitMQ + offline evaluation)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 设置 AILS_TEST_RABBITMQ_URL 后，tests/test_worker_broker.py 会真实连 broker；
      # 未设置时那两条只会 skip。CI 里必须看到它们真的执行。
      - name: Tests (unit + real RabbitMQ)
        working-directory: agent
        env:
          AILS_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: python -m pytest -q

      - name: Offline evaluation
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/agent
        run: python -m evaluation
