spring:
  application:
    name: backend

  # 本机覆盖（数据库密码、JWT 密钥等）。
  # application-local.yml 已被 .gitignore 排除，不存在时 optional: 会让这里静默跳过，
  # 所以新克隆的仓库不带它也能直接启动。详见 README 第九节。
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true 便于首次启动自动建库（需 MySQL 账号有建库权限）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ails}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  servlet:
    multipart:
      # 应用层上限在 ails.document.storage.max-size-bytes（默认 10 MiB）。
      # 这里留出余量，让略超限的文件进入业务校验并稳定返回 413；
      # 如果调大 max-size-bytes，必须同步调大这两个 multipart 上限。
      max-file-size: 20MB
      max-request-size: 21MB

  sql:
    init:
      # CREATE TABLE IF NOT EXISTS，幂等，每次启动执行
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
      continue-on-error: false

  # 学习分析任务队列。只有 ails.analysis.mode=mq 时才会真正建立连接；
  # inline 模式下这些配置不会被使用，没有 RabbitMQ 也能正常启动。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 生产者确认：Java 必须知道 broker 真的收下了任务消息
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 结果消费者手动 ACK：先完成校验与落库，再确认消息
        acknowledge-mode: manual
        prefetch: 1
        # 反序列化失败等「本地无法处理」的消息直接拒绝，交给结果队列的 DLX；
        # 不能让它们无限 requeue 打满日志。
        default-requeue-rejected: false
        # 重试由队列的 TTL + DLX 完成，不用 Spring 的内存重试
        retry:
          enabled: false

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

ails:
  jwt:
    # HS256 密钥需 >= 32 字节；生产环境务必用 JWT_SECRET 环境变量覆盖
    secret: ${JWT_SECRET:ails-dev-7f3a9c2e5b8d1f4a6e0c3b7d9f2a5c8e1b4d7f0a3c6e9b2d5f8a1c4e7b0d3f6a}
    # 过期时间（毫秒），默认 7 天
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}

  # ===================== 文档原文存储 =====================
  document:
    storage:
      # 相对路径基于后端进程工作目录；生产环境应指向持久化卷。
      # 默认 ./data/documents 已加入 backend/backend/.gitignore。
      root: ${AILS_DOCUMENT_STORAGE_ROOT:./data/documents}
      # 单文件字节上限，默认 10 MiB。
      # 必须小于 spring.servlet.multipart.max-file-size（当前 20MB）。
      max-size-bytes: ${AILS_DOCUMENT_MAX_SIZE_BYTES:10485760}

    # 文档解析 / 切块 / Embedding / Qdrant 索引的后台任务。
    # 与聊天 SSE 的线程池完全隔离；队列有界，拒绝时文档直接置 FAILED。
    index:
      core-pool-size: ${AILS_DOCUMENT_INDEX_CORE_POOL_SIZE:2}
      max-pool-size: ${AILS_DOCUMENT_INDEX_MAX_POOL_SIZE:2}
      queue-capacity: ${AILS_DOCUMENT_INDEX_QUEUE_CAPACITY:64}
      # 解析只需上传文件内容；索引可能包含 Embedding API 调用与批量 upsert。
      parse-timeout-ms: ${AILS_DOCUMENT_PARSE_TIMEOUT_MS:60000}
      index-timeout-ms: ${AILS_DOCUMENT_INDEX_TIMEOUT_MS:120000}
      # PROCESSING 超时回收：必须明显大于 parse + index 的最坏耗时（默认 3 分钟），
      # 否则会误伤仍在运行的有效索引任务。只有进程中断/线程挂死才会留到 15 分钟。
      stale-processing-timeout-ms: ${AILS_DOCUMENT_STALE_PROCESSING_TIMEOUT_MS:900000}
      recovery-interval-ms: ${AILS_DOCUMENT_RECOVERY_INTERVAL_MS:300000}
      recovery-initial-delay-ms: ${AILS_DOCUMENT_RECOVERY_INITIAL_DELAY_MS:60000}
      recovery-batch-size: ${AILS_DOCUMENT_RECOVERY_BATCH_SIZE:100}
      # 上传后进程崩溃、永远没有提交索引的 UPLOADING 行：超时后重新提交，超过次数置 FAILED。
      upload-stale-timeout-ms: ${AILS_DOCUMENT_UPLOAD_STALE_TIMEOUT_MS:120000}
      max-index-attempts: ${AILS_DOCUMENT_MAX_INDEX_ATTEMPTS:3}
      # 同一文档两次构建之间的最小间隔，防止重复提交同时抢占。
      reindex-cooldown-ms: ${AILS_DOCUMENT_REINDEX_COOLDOWN_MS:30000}
      # 删除清理：状态先 DELETING 退出检索，失败保留 DELETING 并定时重试。
      delete-retry-interval-ms: ${AILS_DOCUMENT_DELETE_RETRY_INTERVAL_MS:60000}
      delete-retry-initial-delay-ms: ${AILS_DOCUMENT_DELETE_RETRY_INITIAL_DELAY_MS:30000}
      delete-batch-size: ${AILS_DOCUMENT_DELETE_BATCH_SIZE:50}
      delete-max-attempts: ${AILS_DOCUMENT_DELETE_MAX_ATTEMPTS:20}
      # 非活跃版本（切换后的旧索引）延迟清理；失败不影响检索。
      cleanup-interval-ms: ${AILS_DOCUMENT_CLEANUP_INTERVAL_MS:300000}
      cleanup-initial-delay-ms: ${AILS_DOCUMENT_CLEANUP_INITIAL_DELAY_MS:120000}
      cleanup-batch-size: ${AILS_DOCUMENT_CLEANUP_BATCH_SIZE:50}

  agent:
    # AgentGateway 的实现选择，决定「后端把问题发给谁」：
    #   stub —— StubAgentGateway，本机回显，不依赖任何外部进程（默认值，见类注释）
    #   http —— HttpPythonAgentGateway，真发给下面的 Python Agent
    # 默认 stub 是刻意的：新克隆的仓库没装 Python 环境也能启动，
    # scripts/e2e-*.sh 也不会因为 Agent 没起而失败。
    gateway: ${AILS_AGENT_GATEWAY:stub}
    base-url: ${AILS_AGENT_BASE_URL:http://127.0.0.1:8000}
    # 建连超时：Agent 进程在不在，3 秒内就能判定
    connect-timeout-ms: ${AILS_AGENT_CONNECT_TIMEOUT_MS:3000}
    # 整段交换的总时长上限（不是空闲超时）。
    # 必须严格小于 ChatService 的 SSE_TIMEOUT_MS（5 分钟），否则前端先看到超时断流，
    # 而网关还在傻等 —— 那样失败原因会指向错误的一方。
    read-timeout-ms: ${AILS_AGENT_READ_TIMEOUT_MS:240000}
    # 学习分析（POST /agent/analyze）的超时。分析发生在回复之后，但仍占着
    # chatStreamExecutor 的一条线程，所以不能沿用对话的 240 秒。
    # 超时后后端退回 rules-v1，用户无感知；痕迹留在 agent_run.error_message。
    analyze-timeout-ms: ${AILS_AGENT_ANALYZE_TIMEOUT_MS:90000}
    # 记忆向量同步（POST /agent/memories/sync）与检索（POST /agent/memories/search）。
    # 检索是混合检索的一路，必须远小于用户可感知的等待时间；同步发生在 Outbox
    # Relay 中，可以与单次检索使用不同的预算。
    memory-sync-timeout-ms: ${AILS_AGENT_MEMORY_SYNC_TIMEOUT_MS:5000}
    memory-search-timeout-ms: ${AILS_AGENT_MEMORY_SEARCH_TIMEOUT_MS:2000}

  # ===================== 学习分析异步化 =====================
  analysis:
    # inline —— 回复结束后在 chatStreamExecutor 里同步调 Agent（原行为，默认值）。
    # mq     —— 回复结束后只投递一条任务消息，由 Python Agent Worker 消费；
    #           结果经 learning.analysis.result 回到 Result Consumer 再落库。
    # 默认 inline 与 ails.agent.gateway=stub 的理由一致：新克隆的仓库不装 RabbitMQ 也能启动。
    mode: ${AILS_ANALYSIS_MODE:inline}
    # 兜底扫描：把超过阈值仍未完成的分析任务置为 FAILED。
    # 只在 mode=mq 时装配。阈值必须大于「排队 + 分析 + 结果重试」的最坏耗时，
    # 否则仍在队列里的任务会被提前判死；默认 60 分钟。
    compensation:
      enabled: ${AILS_ANALYSIS_COMPENSATION_ENABLED:true}
      stale-after-ms: ${AILS_ANALYSIS_COMPENSATION_STALE_AFTER_MS:3600000}
      interval-ms: ${AILS_ANALYSIS_COMPENSATION_INTERVAL_MS:600000}
      batch-size: ${AILS_ANALYSIS_COMPENSATION_BATCH_SIZE:100}
    mq:
      exchange: ${AILS_ANALYSIS_EXCHANGE:learning.analysis.exchange}
      # 请求消息被拒绝后先进入 retry 队列（TTL），到期再回到请求队列；
      # 超过最大次数后由 Worker 投到死信队列，并回一条 FAILED 结果。
      dlx: ${AILS_ANALYSIS_DLX:learning.analysis.dlx}
      request-queue: ${AILS_ANALYSIS_REQUEST_QUEUE:learning.analysis.request}
      request-routing-key: ${AILS_ANALYSIS_REQUEST_ROUTING_KEY:analysis.request}
      result-queue: ${AILS_ANALYSIS_RESULT_QUEUE:learning.analysis.result}
      result-routing-key: ${AILS_ANALYSIS_RESULT_ROUTING_KEY:analysis.result}
      # 结果消费者遇到数据库闪断等暂时性失败时，先进入这个队列等待 TTL，
      # 再回到结果队列重试；超过 max-retries 次后才进入死信。
      result-retry-queue: ${AILS_ANALYSIS_RESULT_RETRY_QUEUE:learning.analysis.result.retry}
      result-retry-routing-key: ${AILS_ANALYSIS_RESULT_RETRY_ROUTING_KEY:analysis.result.retry}
      retry-queue: ${AILS_ANALYSIS_RETRY_QUEUE:learning.analysis.retry}
      retry-routing-key: ${AILS_ANALYSIS_RETRY_ROUTING_KEY:analysis.retry}
      dead-queue: ${AILS_ANALYSIS_DEAD_QUEUE:learning.analysis.dlq}
      dead-routing-key: ${AILS_ANALYSIS_DEAD_ROUTING_KEY:analysis.dead}
      retry-ttl-ms: ${AILS_ANALYSIS_RETRY_TTL_MS:15000}
      max-retries: ${AILS_ANALYSIS_MAX_RETRIES:3}
      # 等待 broker 确认的时间；超时按投递失败处理，退回同步分析
      confirm-timeout-ms: ${AILS_ANALYSIS_CONFIRM_TIMEOUT_MS:5000}

  # ===================== Agent 内部服务凭据 =====================
  internal:
    # 共享服务凭据：只证明“调用方是内部服务”，不绑定用户。
    # 为空表示禁用内部入口（默认值）。
    token: ${AILS_INTERNAL_TOKEN:}
    # Spring → Agent 的用户身份签名密钥（aud=learning-agent）。Agent 必须持有同一把
    # 密钥才能校验，因此它也能签发同 audience 的声明；后端不接受该 audience。
    identity-secret: ${AILS_INTERNAL_IDENTITY_SECRET:}
    identity-audience: ${AILS_INTERNAL_IDENTITY_AUDIENCE:learning-agent}
    identity-ttl-seconds: ${AILS_INTERNAL_IDENTITY_TTL_SECONDS:60}
    # Spring → 后端读接口的委托签名密钥（aud=learning-backend, scope=analysis:read）。
    # 只存在于 Spring 进程，绝不能下发给 Agent。Agent 仅转发 MQ 任务里的声明。
    delegation-secret: ${AILS_INTERNAL_DELEGATION_SECRET:}
    # Agent Worker → 后端的声明接收方；后端只接受这个 audience。
    backend-identity-audience: ${AILS_BACKEND_IDENTITY_AUDIENCE:learning-backend}
    identity-max-ttl-seconds: ${AILS_INTERNAL_IDENTITY_MAX_TTL_SECONDS:300}
    identity-clock-skew-seconds: ${AILS_INTERNAL_IDENTITY_CLOCK_SKEW_SECONDS:5}
    # MQ 任务可能在队列里等待，委托声明需要比同步链路更长；仍限定为短期。
    # 过期后 Worker 会收到 401/403 并走重试/失败，而不会绕过校验。
    delegation-ttl-seconds: ${AILS_INTERNAL_DELEGATION_TTL_SECONDS:900}
    delegation-max-ttl-seconds: ${AILS_INTERNAL_DELEGATION_MAX_TTL_SECONDS:3600}

logging:
  level:
    com.ails.backend: debug
