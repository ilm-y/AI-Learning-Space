spring:
  application:
    name: backend

  # 本机覆盖（数据库密码、JWT 密钥等）。
  # application-local.yml 已被 .gitignore 排除，不存在时 optional: 会让这里静默跳过，
  # 所以新克隆的仓库不带它也能直接启动。详见 README 第九节。
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true 便于首次启动自动建库（需 MySQL 账号有建库权限）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ails}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  sql:
    init:
      # CREATE TABLE IF NOT EXISTS，幂等，每次启动执行
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
      continue-on-error: false

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

ails:
  jwt:
    # HS256 密钥需 >= 32 字节；生产环境务必用 JWT_SECRET 环境变量覆盖
    secret: ${JWT_SECRET:ails-dev-7f3a9c2e5b8d1f4a6e0c3b7d9f2a5c8e1b4d7f0a3c6e9b2d5f8a1c4e7b0d3f6a}
    # 过期时间（毫秒），默认 7 天
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}

  agent:
    # AgentGateway 的实现选择，决定「后端把问题发给谁」：
    #   stub —— StubAgentGateway，本机回显，不依赖任何外部进程（默认值，见类注释）
    #   http —— HttpPythonAgentGateway，真发给下面的 Python Agent
    # 默认 stub 是刻意的：新克隆的仓库没装 Python 环境也能启动，
    # scripts/e2e-*.sh 也不会因为 Agent 没起而失败。
    gateway: ${AILS_AGENT_GATEWAY:stub}
    base-url: ${AILS_AGENT_BASE_URL:http://127.0.0.1:8000}
    # 建连超时：Agent 进程在不在，3 秒内就能判定
    connect-timeout-ms: ${AILS_AGENT_CONNECT_TIMEOUT_MS:3000}
    # 整段交换的总时长上限（不是空闲超时）。
    # 必须严格小于 ChatService 的 SSE_TIMEOUT_MS（5 分钟），否则前端先看到超时断流，
    # 而网关还在傻等 —— 那样失败原因会指向错误的一方。
    read-timeout-ms: ${AILS_AGENT_READ_TIMEOUT_MS:240000}
    # 学习分析（POST /agent/analyze）的超时。分析发生在回复之后，但仍占着
    # chatStreamExecutor 的一条线程，所以不能沿用对话的 240 秒。
    # 超时后后端退回 rules-v1，用户无感知；痕迹留在 agent_run.error_message。
    analyze-timeout-ms: ${AILS_AGENT_ANALYZE_TIMEOUT_MS:90000}

logging:
  level:
    com.ails.backend: debug
